name: usda-food-mcp

on:
  push:
    branches: [main]
    paths: ["usda-food-mcp/**", ".github/workflows/usda-food-mcp.yml"]
  pull_request:
    paths: ["usda-food-mcp/**", ".github/workflows/usda-food-mcp.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: usda-food-mcp

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t usda-food-mcp .
