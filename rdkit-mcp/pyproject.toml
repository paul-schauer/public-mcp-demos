[project]
name = "rdkit-mcp"
version = "2.0.0"
description = "MCP server exposing RDKit cheminformatics tools for food and flavor chemistry"
readme = "README.md"
license = "MIT"
authors = [{ name = "Paul Schauer" }]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",
    "rdkit>=2024.3",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
rdkit-mcp = "rdkit_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
